services:
  - type: web
    name: room-assets-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 4000
      - key: CORS_ORIGIN
        value: https://<username>.github.io
      # DB_PATH больше не нужен — база будет создана рядом с приложением