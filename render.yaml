services:
  - type: web
    name: room-assets-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 4000
      - key: CORS_ORIGIN
        # Замените на реальный адрес GitHub Pages после первого деплоя фронтенда,
        # например: https://<username>.github.io
        value: https://<username>.github.io
      - key: DB_PATH
        value: /data/room-assets.db
    disk:
      name: room-assets-data
      mountPath: /data
      sizeGB: 1
