services:
  frontend:
    build:
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - WATCHPACK_POLLING=true
      - VITE_API_URL=http://localhost:4000/api
    depends_on:
      - backend

  backend:
    build:
      target: dev
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - PORT=4000
      - CORS_ORIGIN=http://localhost:5173
